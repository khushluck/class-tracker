<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a1a;--card:#081329;--card2:#0a1730;--line:#16294d;--text:#f2f5fb;--muted:#8d9bbd;--blue:#2d6bff;--violet:#8b45ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,#0f1f5a55,transparent),radial-gradient(700px 500px at -10% 100%,#1a1b6a33,transparent),var(--bg);
color:var(--text);font-family:"Manrope","Poppins","Segoe UI",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:44px 24px 64px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:44px}
.brand{display:flex;gap:16px;align-items:center}
.logo{width:68px;height:68px;border-radius:50%;background:#0d1a3a;display:grid;place-items:center;flex:none}
h1{margin:0;font-size:36px;font-weight:600;letter-spacing:-.01em}
h1 span,.grad{background:linear-gradient(90deg,#2d7bff,#6a5bff 60%,#9a4bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:4px 0 0;color:#8fa0d6;font-size:18px}
.tag{font-size:12px;letter-spacing:.18em;color:#7f8fc4;text-transform:uppercase;padding-top:14px;white-space:nowrap}
.tag i{font-style:normal;margin:0 8px;color:#55659b}
.card{max-width:920px;margin:0 auto 22px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:38px 40px}
h2{margin:0 0 6px;font-size:22px;font-weight:600}
.hint{margin:0 0 20px;color:var(--muted);font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:20px;padding:0 24px;height:76px;border:1px solid var(--line);border-radius:14px;background:#0a1530;cursor:pointer;font-size:19px;transition:.2s;position:relative}
.opt:hover{border-color:#27427c}
.opt input{position:absolute;opacity:0;pointer-events:none}
.box{width:34px;height:34px;border-radius:9px;border:2px solid #3b4d78;display:grid;place-items:center;flex:none;transition:.2s}
.box svg{opacity:0;transform:scale(.6);transition:.2s}
.opt.on{border-color:#3a74ff;background:linear-gradient(90deg,#0b1d46,#0a1838);box-shadow:0 0 0 1px #3a74ff55,0 0 24px #2d6bff22}
.opt.on .box{background:#2d6bff;border-color:#4d86ff}
.opt.on .box svg{opacity:1;transform:none}
.opt:has(input:focus-visible){outline:2px solid #6a8dff;outline-offset:3px}
.reveal{display:none;margin-top:30px;animation:in .3s ease}
.reveal.show{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.field{position:relative;display:flex;align-items:center;gap:18px;height:58px;padding:0 20px;border:1px solid #213459;border-radius:12px;background:#07102a;margin-bottom:22px}
.field:focus-within{border-color:#3a74ff}
.field .val{font-size:18px;flex:1}
.field .val.ph{color:#5f6e93}
.field input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.field input[type=date]::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.clear{position:relative;z-index:2;background:none;border:0;color:#aab6d6;font-size:20px;cursor:pointer;padding:6px;line-height:1;display:none}
.field.has .clear{display:block}
.save{display:none;width:100%;height:62px;border:0;border-radius:12px;cursor:pointer;color:#fff;font:600 19px inherit;font-family:inherit;align-items:center;justify-content:center;gap:12px;
background:linear-gradient(90deg,#2a6bff,#6b52ff 60%,#9444ff);box-shadow:0 10px 30px #4a4aff30;transition:.2s}
.save.show{display:flex;animation:in .3s ease}
.save:hover{filter:brightness(1.1);transform:translateY(-1px)}
.save:active{transform:none}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:hidden;overflow-x:auto;margin-top:22px}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{text-align:left;padding:15px 22px;font-size:16px}
th{background:#0c1a3a;font-weight:600;font-size:16px}
td{border-top:1px solid var(--line);background:#071026}
th:first-child,td:first-child{width:18%}th:nth-child(2),td:nth-child(2){width:36%}
td.empty{text-align:center;color:var(--muted);padding:34px 22px}
.pill{display:inline-flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399}.dot.no{background:#f87171}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0d1c42;border:1px solid #2c4c93;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.wrap{padding:28px 16px 48px}header{flex-direction:column;margin-bottom:28px}.tag{padding:0}h1{font-size:28px}.sub{font-size:15px}.logo{width:54px;height:54px}
.card{padding:26px 20px}.opts{grid-template-columns:1fr}.opt{height:66px;font-size:17px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d86ff"/><stop offset="1" stop-color="#a24bff"/></linearGradient></defs><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg></div>
      <div><h1>Class <span>Tracker</span></h1><p class="sub">Keep track of your classes, one day at a time.</p></div>
    </div>
    <div class="tag">Small steps<i>/</i>Big progress</div>
  </header>

  <section class="card">
    <h2>Class Status</h2>
    <p class="hint">Select the status of your class and add the date.</p>
    <div class="opts">
      <label class="opt" id="optDone"><input type="checkbox" id="cbDone"><span class="box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>Class Done</label>
      <label class="opt" id="optNot"><input type="checkbox" id="cbNot"><span class="box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>Class Not Done</label>
    </div>

    <div class="reveal" id="dateBlock">
      <h2>Date</h2>
      <p class="hint" id="dateHint">Enter the date when the class was done.</p>
      <div class="field" id="field">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9db0dd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
        <span class="val ph" id="val">dd-mm-yyyy</span>
        <input type="date" id="date" aria-label="Class date">
        <button class="clear" id="clear" type="button" aria-label="Clear date">✕</button>
      </div>
      <button class="save" id="save" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg>Save</button>
    </div>
  </section>

  <section class="card">
    <h2>Saved Records</h2>
    <div class="tbl"><table>
      <thead><tr><th>#</th><th>Date</th><th>Class Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</div>
<div class="toast" id="toast" role="status">Saved</div>

<script>
(function(){
  var cbDone=document.getElementById('cbDone'),cbNot=document.getElementById('cbNot'),
      optDone=document.getElementById('optDone'),optNot=document.getElementById('optNot'),
      block=document.getElementById('dateBlock'),hint=document.getElementById('dateHint'),
      date=document.getElementById('date'),val=document.getElementById('val'),field=document.getElementById('field'),
      clr=document.getElementById('clear'),save=document.getElementById('save'),rows=document.getElementById('rows'),toast=document.getElementById('toast');
  var KEY='classTracker.records', records=[];
  try{records=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){records=[]}

  function fmt(iso){var p=iso.split('-');return p[2]+'-'+p[1]+'-'+p[0]}
  function status(){return cbDone.checked?'Class Done':cbNot.checked?'Class Not Done':''}

  function sync(){
    optDone.classList.toggle('on',cbDone.checked);
    optNot.classList.toggle('on',cbNot.checked);
    var s=status();
    block.classList.toggle('show',!!s);
    if(s) hint.textContent='Enter the date when the class was '+(cbDone.checked?'done.':'not done.');
    var has=!!date.value;
    field.classList.toggle('has',has);
    val.textContent=has?fmt(date.value):'dd-mm-yyyy';
    val.classList.toggle('ph',!has);
    save.classList.toggle('show',!!s&&has);
  }

  cbDone.addEventListener('change',function(){if(cbDone.checked)cbNot.checked=false;sync()});
  cbNot.addEventListener('change',function(){if(cbNot.checked)cbDone.checked=false;sync()});
  date.addEventListener('input',sync);
  date.addEventListener('click',function(){try{date.showPicker()}catch(e){}});
  clr.addEventListener('click',function(e){e.stopPropagation();date.value='';sync()});

  function render(){
    if(!records.length){rows.innerHTML='<tr><td class="empty" colspan="3">No records yet. Save your first class above.</td></tr>';return}
    rows.innerHTML=records.map(function(r,i){
      var d=r.status==='Class Done';
      return '<tr><td>'+(i+1)+'</td><td>'+fmt(r.date)+'</td><td><span class="pill"><span class="dot'+(d?'':' no')+'"></span>'+r.status+'</span></td></tr>';
    }).join('');
  }

  save.addEventListener('click',function(){
    if(!date.value||!status())return;
    records.unshift({date:date.value,status:status()});
    try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){}
    render();
    cbDone.checked=cbNot.checked=false;date.value='';sync();
    toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},1800);
  });

  render();sync();
})();
</script>
</body>
</html>
